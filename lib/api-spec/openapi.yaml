openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Lu Xun Essays Digital Archive API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: collections
    description: Essay collection operations
  - name: essays
    description: Essay operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: admin
    description: Admin panel operations (curators only).
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /collections:
    get:
      operationId: listCollections
      tags: [collections]
      summary: List all collections
      description: Returns all 17 Lu Xun essay collections in chronological order
      responses:
        "200":
          description: List of collections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Collection"

  /collections/{slug}:
    get:
      operationId: getCollection
      tags: [collections]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      summary: Get a single collection
      responses:
        "200":
          description: Collection details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /collections/{slug}/essays:
    get:
      operationId: listEssaysByCollection
      tags: [essays]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      summary: List essays in a collection
      responses:
        "200":
          description: List of essays in the collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EssaySummary"
        "404":
          description: Collection not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /essays:
    get:
      operationId: listEssays
      tags: [essays]
      summary: List all essays
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Full-text search across title, themes, content
        - name: collectionSlug
          in: query
          required: false
          schema:
            type: string
        - name: essayType
          in: query
          required: false
          schema:
            type: string
        - name: difficulty
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of essays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EssaySummary"

  /essays/{essayId}:
    get:
      operationId: getEssay
      tags: [essays]
      parameters:
        - name: essayId
          in: path
          required: true
          schema:
            type: string
      summary: Get essay details including full content
      responses:
        "200":
          description: Essay details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Essay"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /essays/featured:
    get:
      operationId: getFeaturedEssays
      tags: [essays]
      summary: Get featured/highlighted essays for homepage
      responses:
        "200":
          description: Featured essays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EssaySummary"

  /stats:
    get:
      operationId: getArchiveStats
      tags: [essays]
      summary: Get archive statistics (total essays, collections, etc.)
      responses:
        "200":
          description: Archive statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveStats"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"

  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to OIDC authorization endpoint.

  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        "302":
          description: Redirect after callback.

  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "302":
          description: Redirect to OIDC logout URL.

  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
      responses:
        "200":
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"

  /admin/me:
    get:
      tags: [admin]
      operationId: getAdminMe
      summary: Get the currently authenticated admin
      responses:
        "200":
          description: Admin user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMeResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/essays/upload:
    post:
      tags: [admin]
      operationId: uploadAdminEssay
      summary: Upload a Markdown file (creates new essay or updates existing)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Updated existing essay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUploadResult"
        "201":
          description: Created new essay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUploadResult"
        "400":
          description: Invalid markdown or missing required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/essays/preview:
    post:
      tags: [admin]
      operationId: previewAdminEssay
      summary: Parse a Markdown file without saving
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Parsed markdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminParsedMarkdown"
        "400":
          description: Invalid markdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/template.md:
    get:
      tags: [admin]
      operationId: getAdminTemplate
      summary: Download the commented Markdown template
      responses:
        "200":
          description: Markdown template file
          content:
            text/markdown:
              schema:
                type: string

  /admin/essays:
    get:
      tags: [admin]
      operationId: listAdminEssays
      summary: List all essays with completeness flags
      responses:
        "200":
          description: List of essays with language flags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminEssayRow"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/essays/{essayId}:
    patch:
      tags: [admin]
      operationId: updateAdminEssay
      parameters:
        - name: essayId
          in: path
          required: true
          schema:
            type: string
      summary: Update essay metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminEssayPatch"
      responses:
        "200":
          description: Updated essay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEssayDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [admin]
      operationId: deleteAdminEssay
      parameters:
        - name: essayId
          in: path
          required: true
          schema:
            type: string
      summary: Delete an essay
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSuccess"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [admin]
      operationId: getAdminEssay
      parameters:
        - name: essayId
          in: path
          required: true
          schema:
            type: string
      summary: Get an essay (admin)
      responses:
        "200":
          description: Essay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEssayDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Collection:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        titleZh:
          type: string
        titlePt:
          type: string
        titleEn:
          type: string
        year:
          type: integer
        volumeNumber:
          type: integer
        essayCount:
          type: integer
        characteristics:
          type: string
        isPoeticCollection:
          type: boolean
          description: True for Wild Grass (野草) prose poems
        sortOrder:
          type: integer
      required:
        - id
        - slug
        - titleZh
        - titlePt
        - year
        - volumeNumber
        - essayCount
        - characteristics
        - isPoeticCollection
        - sortOrder

    EssaySummary:
      type: object
      properties:
        id:
          type: integer
        essayId:
          type: string
        titlePt:
          type: string
        titleZh:
          type: string
        titlePinyin:
          type: string
        collectionSlug:
          type: string
        collectionTitlePt:
          type: string
        firstPublishedDate:
          type: string
          nullable: true
        firstPublishedVenuePt:
          type: string
          nullable: true
        pseudonymUsed:
          type: string
          nullable: true
        essayType:
          type: string
        genreTagsPt:
          type: array
          items:
            type: string
        difficultyLevel:
          type: string
        estimatedReadingTime:
          type: integer
          nullable: true
        wordCountPt:
          type: integer
          nullable: true
      required:
        - id
        - essayId
        - titlePt
        - titleZh
        - collectionSlug
        - collectionTitlePt
        - essayType
        - genreTagsPt
        - difficultyLevel

    Essay:
      type: object
      properties:
        id:
          type: integer
        essayId:
          type: string
        titlePt:
          type: string
        titleZh:
          type: string
        titlePinyin:
          type: string
        collectionSlug:
          type: string
        collectionTitleZh:
          type: string
        collectionTitlePt:
          type: string
        volumeNumber:
          type: integer
        firstPublishedDate:
          type: string
          nullable: true
        firstPublishedVenueZh:
          type: string
          nullable: true
        firstPublishedVenuePt:
          type: string
          nullable: true
        pseudonymUsed:
          type: string
          nullable: true
        pseudonymNotePt:
          type: string
          nullable: true
        essayType:
          type: string
        genreTagsPt:
          type: array
          items:
            type: string
        genreTagsZh:
          type: array
          items:
            type: string
        themesPt:
          type: array
          items:
            type: string
        historicalContextPt:
          type: string
          nullable: true
        contentOriginalZh:
          type: string
          nullable: true
        contentModernZh:
          type: string
          nullable: true
        contentPinyin:
          type: string
          nullable: true
        contentPt:
          type: string
          nullable: true
        translatorName:
          type: string
          nullable: true
        translationNotesPt:
          type: string
          nullable: true
        sourceTextEdition:
          type: string
          nullable: true
        difficultyLevel:
          type: string
        estimatedReadingTime:
          type: integer
          nullable: true
        wordCountPt:
          type: integer
          nullable: true
        wordCountZh:
          type: integer
          nullable: true
      required:
        - id
        - essayId
        - titlePt
        - titleZh
        - collectionSlug
        - collectionTitlePt
        - volumeNumber
        - essayType
        - genreTagsPt
        - genreTagsZh
        - themesPt
        - difficultyLevel

    ArchiveStats:
      type: object
      properties:
        totalEssays:
          type: integer
        totalCollections:
          type: integer
        yearRange:
          type: string
        totalPseudonyms:
          type: integer
        essaysByType:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              count:
                type: integer
            required:
              - type
              - count
        essaysByVolume:
          type: array
          items:
            type: object
            properties:
              volume:
                type: integer
              count:
                type: integer
            required:
              - volume
              - count
      required:
        - totalEssays
        - totalCollections
        - yearRange
        - totalPseudonyms
        - essaysByType
        - essaysByVolume

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, "null"]
          format: email
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        profileImageUrl:
          type: [string, "null"]

    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"

    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1

    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string

    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true

    AdminMeResponse:
      type: object
      required: [user, isAdmin]
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        isAdmin:
          type: boolean

    AdminEssayRow:
      type: object
      required:
        - essayId
        - titlePt
        - titleZh
        - collectionSlug
        - hasOriginalZh
        - hasModernZh
        - hasPinyin
        - hasPt
        - isFeatured
      properties:
        essayId:
          type: string
        titlePt:
          type: string
        titleZh:
          type: string
        titlePinyin:
          type: [string, "null"]
        collectionSlug:
          type: string
        collectionTitlePt:
          type: [string, "null"]
        firstPublishedDate:
          type: [string, "null"]
        essayType:
          type: string
        difficultyLevel:
          type: string
        hasOriginalZh:
          type: boolean
        hasModernZh:
          type: boolean
        hasPinyin:
          type: boolean
        hasPt:
          type: boolean
        isFeatured:
          type: boolean

    AdminEssayDetail:
      type: object
      required: [essayId, titlePt, titleZh, collectionSlug]
      properties:
        essayId:
          type: string
        titlePt:
          type: string
        titleZh:
          type: string
        titlePinyin:
          type: [string, "null"]
        collectionSlug:
          type: string
        firstPublishedDate:
          type: [string, "null"]
        firstPublishedVenuePt:
          type: [string, "null"]
        firstPublishedVenueZh:
          type: [string, "null"]
        pseudonymUsed:
          type: [string, "null"]
        pseudonymNotePt:
          type: [string, "null"]
        essayType:
          type: string
        genreTagsPt:
          type: array
          items:
            type: string
        themesPt:
          type: array
          items:
            type: string
        difficultyLevel:
          type: string
        isFeatured:
          type: boolean
        translatorName:
          type: [string, "null"]
        sourceTextEdition:
          type: [string, "null"]
        historicalContextPt:
          type: [string, "null"]
        translationNotesPt:
          type: [string, "null"]
        contentOriginalZh:
          type: [string, "null"]
        contentModernZh:
          type: [string, "null"]
        contentPinyin:
          type: [string, "null"]
        contentPt:
          type: [string, "null"]
        wordCountPt:
          type: [integer, "null"]
        wordCountZh:
          type: [integer, "null"]
        estimatedReadingTime:
          type: [integer, "null"]

    AdminEssayPatch:
      type: object
      properties:
        titlePt:
          type: string
        titleZh:
          type: string
        titlePinyin:
          type: string
        collectionSlug:
          type: string
        firstPublishedDate:
          type: string
        firstPublishedVenuePt:
          type: string
        firstPublishedVenueZh:
          type: string
        pseudonymUsed:
          type: string
        pseudonymNotePt:
          type: string
        essayType:
          type: string
        difficultyLevel:
          type: string
        isFeatured:
          type: boolean
        translatorName:
          type: string
        sourceTextEdition:
          type: string
        genreTagsPt:
          type: array
          items:
            type: string
        themesPt:
          type: array
          items:
            type: string

    DeleteSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    AdminUploadResult:
      type: object
      required: [action, essayId]
      properties:
        action:
          type: string
          enum: [created, updated]
        essayId:
          type: string

    AdminParsedMarkdown:
      type: object
      required: [frontmatter, sections, derived]
      properties:
        frontmatter:
          type: object
          additionalProperties: true
        sections:
          type: object
          properties:
            historicalContextPt:
              type: string
            contentOriginalZh:
              type: string
            contentModernZh:
              type: string
            contentPinyin:
              type: string
            contentPt:
              type: string
            translationNotesPt:
              type: string
        derived:
          type: object
          required: [wordCountPt, wordCountZh, estimatedReadingTime]
          properties:
            wordCountPt:
              type: [integer, "null"]
            wordCountZh:
              type: [integer, "null"]
            estimatedReadingTime:
              type: [integer, "null"]
